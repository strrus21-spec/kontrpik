# Деплой на GitHub Pages: сборка Vite + свежие данные из ветки data.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Наложить данные из ветки data (если есть)
        run: |
          if git fetch --depth=1 origin data; then git archive FETCH_HEAD | tar -x -C public; fi
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          # Адрес бэкенда стрима (worker/), например https://kontrpik-room.<аккаунт>.workers.dev.
          # Пусто — комнаты и таблица лидеров на сайте скрыты.
          VITE_ROOM_API: ${{ vars.ROOM_API_URL }}
          VITE_CF_BEACON: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
