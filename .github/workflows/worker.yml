# Деплой бэкенда стрима (worker/) в Cloudflare Workers.
# Нужны секреты репозитория CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers») и CLOUDFLARE_ACCOUNT_ID.
name: Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'src/room-protocol.ts']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - name: Проверить секреты
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "Нет секрета CLOUDFLARE_API_TOKEN — деплой пропущен."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != '1'
        working-directory: worker
        run: npm ci && npx tsc --noEmit
      - if: steps.check.outputs.skip != '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var ALLOWED_ORIGINS:"${{ vars.SITE_ORIGIN }}"
