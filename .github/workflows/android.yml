# Android-приложение DotaPick (папка android/): сборка APK, релиз на GitHub и скриншоты с эмулятора.
name: Android
on:
  push:
    branches: [main, android-app]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Собрать APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk DotaPick.apk
      - uses: actions/upload-artifact@v4
        with: { name: DotaPick-apk, path: DotaPick.apk }
      - name: Релиз «Android — последняя версия»
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=android-latest
          NOTES="DotaPick для Android, сборка ${{ github.run_number }} ($(date -u +%F)). Установка: скачать DotaPick.apk на телефон и открыть."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DotaPick.apk --clobber
            gh release edit "$TAG" --notes "$NOTES" --target "${{ github.sha }}"
          else
            gh release create "$TAG" DotaPick.apk --title "DotaPick для Android" --notes "$NOTES" --target "${{ github.sha }}" --prerelease
          fi

  screenshots:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DotaPick-apk }
      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 'Эмулятор — установить, открыть, снять экран'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r DotaPick.apk
            adb shell am start -n pro.dotapick.app/.MainActivity
            sleep 25
            adb exec-out screencap -p > shot-home.png
            adb shell input tap 540 240 || true
            adb shell am start -a android.intent.action.VIEW -d https://dotapick.pro/#counterpick pro.dotapick.app
            sleep 15
            adb exec-out screencap -p > shot-counterpick.png
            adb shell am start -a android.intent.action.VIEW -d https://dotapick.pro/#about pro.dotapick.app
            sleep 12
            adb exec-out screencap -p > shot-about.png
            adb shell input keyevent KEYCODE_BACK
            sleep 4
            adb exec-out screencap -p > shot-back.png
            adb shell svc wifi disable; adb shell svc data disable
            adb shell am force-stop pro.dotapick.app
            adb shell am start -n pro.dotapick.app/.MainActivity
            sleep 8
            adb exec-out screencap -p > shot-offline.png
            adb shell svc wifi enable; adb shell svc data enable
            adb shell cmd package resolve-activity --brief -c android.intent.category.HOME -a android.intent.action.MAIN | tail -1
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb exec-out screencap -p > shot-launcher.png
      - name: Скриншоты в релиз
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: gh release upload android-latest shot-*.png --clobber
