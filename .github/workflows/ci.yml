name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build          # tsc + vite build
      - run: npm test               # Vitest: алгоритм счёта на фикстуре, состояние, сборка данных
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e            # Playwright: 1440 и 400 px, RU и EN
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 7
